{% extends "base.html" %}

{% block title %}上传商品 - 每羊小超市{% endblock %}

{% block content %}
<div class="section-head">
    <div>
        <p class="eyebrow">New Product</p>
        <h1>上传新商品</h1>
        <p class="muted">清晰的标题、图片和库存会让商品更容易被买家理解。</p>
    </div>
    <a class="btn secondary" href="{% url 'store' %}">返回店铺</a>
</div>

<section class="panel" style="padding:24px;">
    <form class="form-stack" action="{% url 'update_product' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            <div class="field">
                <label for="title">商品名称</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="field">
                <label for="category">商品分类</label>
                <input type="text" id="category" name="category" required>
            </div>
            <div class="field">
                <label for="price">商品价格（元）</label>
                <input type="number" id="price" name="price" step="0.01" min="0" required>
            </div>
            <div class="field">
                <label for="inventory">库存数量</label>
                <input type="number" id="inventory" name="inventory" min="0" value="1" required>
            </div>
        </div>
        <div class="field">
            <label for="description">商品描述</label>
            <textarea id="description" name="description" required></textarea>
        </div>
        <div class="field">
            <label for="image">商品主图</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        <button type="submit">发布商品</button>
    </form>
</section>
{% endblock %}
